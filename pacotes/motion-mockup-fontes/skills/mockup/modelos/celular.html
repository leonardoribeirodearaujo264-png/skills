<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup celular</title>
<style>
  /* =========================================================
     TROQUE AQUI
     --imagem: o print do app. Ex.: url("meu-app.png")
       (caminho relativo a este arquivo). O valor padrao e um
       marcador cinza: nunca entregue o mockup com ele.
     --ajuste: cover preenche a tela cortando as bordas, sem
       distorcer. contain mostra a imagem inteira, com faixas.
     --posicao: que parte da imagem fica visivel no cover.
     O tamanho do PNG vem do --window-size do navegador.
     ========================================================= */
  :root {
    --imagem: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 1950'><rect width='900' height='1950' fill='%23f4f5f8'/><rect x='60' y='150' width='780' height='120' rx='24' fill='%23e3e6ec'/><rect x='60' y='320' width='780' height='560' rx='32' fill='%23dde1e8'/><rect x='60' y='930' width='780' height='160' rx='24' fill='%23e3e6ec'/><rect x='60' y='1130' width='780' height='160' rx='24' fill='%23e3e6ec'/><rect x='60' y='1330' width='780' height='160' rx='24' fill='%23e3e6ec'/><rect x='0' y='1790' width='900' height='160' fill='%23e3e6ec'/><text x='450' y='620' font-family='Arial' font-size='64' fill='%238a90a0' text-anchor='middle'>Seu app aqui</text></svg>");
    --ajuste: cover;
    --posicao: top center;

    --fundo-1: #f6f1ea;
    --fundo-2: #d9cbbb;
    --corpo: #15161a;
    --aro: #5a5d66;
    --sombra: rgba(28, 22, 16, 0.40);
    --brilho: 0.06;

    --rotacao-x: 0deg;
    --rotacao-y: 0deg;
    --rotacao-z: 0deg;

    /* largura do aparelho: cabe com margem segura em 1:1, 4:5, 9:16 e 16:9 */
    --w: min(calc(84vh * 0.49), 60vw);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid;
    place-items: center;
    overflow: hidden;
    background: radial-gradient(110% 80% at 50% 15%, var(--fundo-1), var(--fundo-2));
  }

  .cena { position: relative; width: var(--w); perspective: calc(var(--w) * 5); }

  .celular {
    position: relative;
    padding: calc(var(--w) * 0.034);
    background: var(--corpo);
    border-radius: calc(var(--w) * 0.16);
    box-shadow:
      0 0 0 calc(var(--w) * 0.009) var(--aro),
      inset 0 0 0 calc(var(--w) * 0.004) #000,
      0 calc(var(--w) * 0.08) calc(var(--w) * 0.16) var(--sombra);
    transform: rotateX(var(--rotacao-x)) rotateY(var(--rotacao-y)) rotateZ(var(--rotacao-z));
  }

  .tela {
    position: relative;
    aspect-ratio: 9 / 19.5;
    overflow: hidden;
    border-radius: calc(var(--w) * 0.128);
    background-color: #000;
    background-image: var(--imagem);
    background-size: var(--ajuste);
    background-position: var(--posicao);
    background-repeat: no-repeat;
  }

  .tela::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, rgba(255, 255, 255, var(--brilho)) 0%, rgba(255, 255, 255, 0) 45%);
    pointer-events: none;
  }

  /* camera frontal generica, em furo redondo */
  .camera {
    position: absolute;
    top: calc(var(--w) * 0.06);
    left: 50%;
    width: calc(var(--w) * 0.036);
    aspect-ratio: 1;
    border-radius: 50%;
    background: #050506;
    box-shadow: inset 0 0 0 calc(var(--w) * 0.004) #1d1f24;
    transform: translateX(-50%);
    z-index: 2;
  }

  .botao {
    position: absolute;
    width: calc(var(--w) * 0.012);
    background: var(--aro);
    border-radius: calc(var(--w) * 0.01);
  }
  .botao.liga { right: calc(var(--w) * -0.02); top: 24%; height: 11%; }
  .botao.volume-1 { left: calc(var(--w) * -0.02); top: 20%; height: 7%; }
  .botao.volume-2 { left: calc(var(--w) * -0.02); top: 29%; height: 7%; }

  .sombra-chao {
    position: absolute;
    left: 12%;
    right: 12%;
    bottom: calc(var(--w) * -0.1);
    height: calc(var(--w) * 0.08);
    background: radial-gradient(50% 50% at 50% 50%, var(--sombra), transparent 70%);
    z-index: -1;
  }
</style>
</head>
<body>
  <div class="cena">
    <div class="celular">
      <span class="botao liga" aria-hidden="true"></span>
      <span class="botao volume-1" aria-hidden="true"></span>
      <span class="botao volume-2" aria-hidden="true"></span>
      <span class="camera" aria-hidden="true"></span>
      <div class="tela" role="img" aria-label="Tela do app no celular"></div>
    </div>
    <div class="sombra-chao" aria-hidden="true"></div>
  </div>
</body>
</html>
